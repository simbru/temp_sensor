[project]
name = "tempsens"
version = "0.1.0"
authors = [
  { name="Simen Bruøygard", email="simen.bruoy@gmail.com" },
]
description = "Temperature and humidity monitoring system for Raspberry Pi with multiple sensor support (DHT22, AHT20, BME280)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Minimal core dependencies shared by both client and server
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "psutil",
]

[dependency-groups]
client = [
    # Raspberry Pi client dependencies (both standard sensors and Enviro+)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
server = [
    # Server dashboard dependencies
    "bokeh",
    "requests>=2.31.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
local-dev = [
    # All dependencies for local development (excludes pi-hardware)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "bokeh",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Pi-specific hardware (must be installed separately on Raspberry Pi)
# Install with: uv sync --extra pi-hardware
pi-hardware = [
    # CircuitPython compatibility layer (provides board module)
    "adafruit-blinka; sys_platform == 'linux'",
    # DHT22 sensor support
    "adafruit-circuitpython-dht; sys_platform == 'linux'",
    "RPi.GPIO; sys_platform == 'linux'",
    # AHT20 sensor support
    "adafruit-circuitpython-ahtx0; sys_platform == 'linux'",
    # BME280 sensor support (Enviro module)
    "adafruit-circuitpython-bme280; sys_platform == 'linux'",
]
# Pimoroni Enviro+ support (BME280, light, noise sensors with LCD display)
# Install with: uv sync --group client --extra enviroplus
# The client group provides fastapi and uvicorn for the API server
enviroplus = [
    "pimoroni-bme280; sys_platform == 'linux'",
    "smbus2; sys_platform == 'linux'",
    "ltr559; sys_platform == 'linux'",
    "st7735; sys_platform == 'linux'",
    "pillow; sys_platform == 'linux'",  # Required for LCD display
    "fonts; sys_platform == 'linux'",
    "font-roboto; sys_platform == 'linux'",
    "paho-mqtt; sys_platform == 'linux'",
]

