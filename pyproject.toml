[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tempsens"
version = "0.1.0"
authors = [
  { name="Simen Bruøygard", email="simen.bruoy@gmail.com" },
]
description = "Temperature and humidity monitoring system for Raspberry Pi with DHT22 sensor"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Minimal core dependencies shared by both client and server
    "numpy>=1.26.4",
    "pandas",
    "psutil",
]

[dependency-groups]
client = [
    # Raspberry Pi client dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
server = [
    # Server dashboard dependencies
    "bokeh",
    "requests>=2.31.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
test = [
    # Testing dependencies
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # For testing FastAPI endpoints
]

[project.optional-dependencies]
# Pi-specific hardware (must be installed separately on Raspberry Pi)
pi-hardware = [
    "adafruit-circuitpython-dht; sys_platform == 'linux'",
    "RPi.GPIO; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tempsens*", "server*"]
exclude = ["dev*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=tempsens --cov=server --cov-report=term-missing"

