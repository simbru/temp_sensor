[project]
name = "tempsens"
version = "0.1.0"
authors = [
  { name="Simen Bruøygard", email="simen.bruoy@gmail.com" },
]
description = "Temperature and humidity monitoring system for Raspberry Pi with DHT22 sensor"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Minimal core dependencies shared by both client and server
    "numpy>=1.26.4",
    "pandas",
    "psutil",
]

[dependency-groups]
client = [
    # Raspberry Pi client dependencies
    "h5py>=3.10",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "adafruit_dht; sys_platform == 'linux'",
]
server = [
    # Server dashboard dependencies
    "bokeh",
    "requests>=2.31.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[tool.uv]
# No groups installed by default - must explicitly choose client or server
default-groups = []

